name: Build TrollDecryptJB

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Packages (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid and system tools
        run: |
          sudo curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid --version || ldid -h || true

      - name: Setup RootHide Theos
        run: |
          git clone --recursive https://github.com/RootHide/Theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Linux iOS Toolchain
        run: |
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/
          ls -la ~/theos/toolchain/linux/iphone/bin/ || true

      - name: Setup iOS SDK
        run: |
          git clone --quiet --depth=1 https://github.com/theos/sdks.git ~/sdks-temp
          mkdir -p ~/theos/sdks
          cp -r ~/sdks-temp/*.sdk ~/theos/sdks/ || true
          rm -rf ~/sdks-temp

      - name: Compile RootHide Package
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=roothide
          ldid -Sentitlements.plist flexdecrypt_bin || true
          echo "=== Entitlements in flexdecrypt_bin ==="
          ldid -e flexdecrypt_bin || true
          chmod +x flexdecrypt_bin dlopentool.c || true
          make clean
          make package FINALPACKAGE=1
          mkdir -p out-roothide
          cp packages/*.deb out-roothide/

      - name: Compile Rootless Package
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=rootless
          ldid -Sentitlements.plist flexdecrypt_bin || true
          make clean
          make package FINALPACKAGE=1
          mkdir -p out-rootless
          cp packages/*.deb out-rootless/

      - name: Upload RootHide .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecryptJB-roothide
          path: out-roothide/*.deb

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecryptJB-rootless
          path: out-rootless/*.deb
