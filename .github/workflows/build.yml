name: Build TrollDecryptJB

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid and system tools
        run: |
          sudo curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid --version || ldid -h || true

      - name: Setup RootHide Theos
        run: |
          git clone --recursive https://github.com/RootHide/Theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Linux iOS Toolchain
        run: |
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/
          ls -la ~/theos/toolchain/linux/iphone/bin/ || true

      - name: Setup iOS SDK
        run: |
          git clone --quiet --depth=1 https://github.com/theos/sdks.git ~/sdks-temp
          mkdir -p ~/theos/sdks
          cp -r ~/sdks-temp/*.sdk ~/theos/sdks/ || true
          rm -rf ~/sdks-temp

      - name: Compile Package
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=roothide
          chmod +x flexdecrypt_bin dlopentool.c || true
          make clean
          make package FINALPACKAGE=1

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecryptJB-roothide-linux
          path: packages/*.deb

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/RootHide/Theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --quiet --depth=1 https://github.com/theos/sdks.git ~/sdks-temp
          mkdir -p ~/theos/sdks
          cp -r ~/sdks-temp/*.sdk ~/theos/sdks/ || true
          rm -rf ~/sdks-temp

      - name: Compile Package
        run: |
          export THEOS_PACKAGE_SCHEME=roothide
          chmod +x flexdecrypt_bin dlopentool.c || true
          make clean
          make package FINALPACKAGE=1

      - name: Upload macOS .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecryptJB-roothide-macos
          path: packages/*.deb
