name: Build TrollDecryptJB

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [roothide]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        run: |
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            git clone --recursive https://github.com/RootHide/Theos.git ~/theos
          else
            git clone --recursive https://github.com/theos/theos.git ~/theos
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --quiet --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Compile Package
        run: |
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            export THEOS_PACKAGE_SCHEME=roothide
          elif [ "${{ matrix.scheme }}" = "rootless" ]; then
            export THEOS_PACKAGE_SCHEME=rootless
          fi
          
          # Assicura permessi di esecuzione per dlopentool e flexdecrypt_bin
          chmod +x flexdecrypt_bin dlopentool.c || true

          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecryptJB-${{ matrix.scheme }}
          path: packages/*.deb
